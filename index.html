<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#000000">

    <title>Раскрой</title>
    <link rel="canonical" href="https://yugle7.github.io/wh-cut-test/"/>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        #print * {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.2;
            font-size: 4mm;
        }

        #print {
            display: block;
            width: 100%;
            height: 100%;
            background: white;
        }

        table {
            border-collapse: collapse;
        }

        th {
            background-color: lightgray;
            text-align: center;
            print-color-adjust: exact;
            -webkit-print-color-adjust: exact;
        }

        th {
            white-space: nowrap;
        }

        th, td {
            border: 1px solid black;
            padding: 1mm 2mm;
            text-align: center;
            width: fit-content;
        }

        tbody,
        thead,
        tr {
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .page {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            width: 100%;
            min-height: 297mm;
            box-sizing: border-box;
            padding: 1cm 3cm 1cm 1cm;
            page-break-after: always;
            break-after: page;
            overflow: hidden;
            page-break-inside: avoid;
        }

        .takes {
            transform: rotate(90deg) translateY(100%);
            transform-origin: right bottom;
            width: auto;
            -webkit-transform: rotate(90deg) translateY(100%);
            -webkit-transform-origin: right bottom;
            page-break-inside: avoid;
            break-inside: avoid;
        }


        body {
            margin: 0;
            padding: 0;
        }

        #print, #print * {
            color: black;
            visibility: visible;
        }

        .col {
            display: flex;
            flex-direction: column;
            gap: 0;
            width: 100%;
            align-items: center;
        }

        .line {
            width: 40px;
            height: 4px;
        }

        .black {
            stroke: black;
        }

        @media print {
            @page {
                margin: 0 !important;
                size: A4;
            }

            @page {
                @top-center {
                    content: none;
                }
                @bottom-center {
                    content: none;
                }
            }


        }
    </style>
</head>
